<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Download Lingua</title>
    <style>
      :root {
        --bg: #f7f7f7;
        --card: #ffffff;
        --text: #3c3c3c;
        --muted: #777777;
        --green: #58cc02;
        --green-dark: #46a302;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #131f24;
          --card: #1f2c33;
          --text: #f1f7fb;
          --muted: #9db0ba;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border-radius: 24px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      }
      h1 { margin: 0 0 8px; font-size: 32px; }
      p { margin: 0 0 24px; color: var(--muted); line-height: 1.5; }
      .btn {
        display: block;
        padding: 16px;
        border-radius: 16px;
        background: var(--green);
        color: #fff;
        font-weight: 800;
        font-size: 18px;
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        box-shadow: 0 4px 0 var(--green-dark);
      }
      .btn:active { transform: translateY(4px); box-shadow: none; }
      ol {
        text-align: left;
        margin: 24px 0 0;
        padding-left: 20px;
        color: var(--muted);
        line-height: 1.7;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Lingua</h1>
      <p>Learn languages with an AI teacher. Android demo build.</p>
      <a
        class="btn"
        href="https://github.com/TinomutendaN/AI-teacher/releases/latest/download/lingua.apk"
        >Download APK</a
      >
      <ol>
        <li>Open this page on your Android phone and tap Download.</li>
        <li>Open the downloaded file. If asked, allow installs from your browser.</li>
        <li>If Play Protect warns you, tap "More details" → "Install anyway".</li>
      </ol>
    </main>
  </body>
